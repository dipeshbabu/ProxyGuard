[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "proxyguard"
version = "0.1.0"
description = "Finite-sample reliability inference for randomized data-release mechanisms evaluated on shared targets."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "scipy>=1.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=9",
    "ruff>=0.12",
]
experiments = [
    "matplotlib>=3.8",
]

[tool.setuptools.packages.find]
include = ["proxyguard*"]

[tool.ruff]
target-version = "py311"
line-length = 120
